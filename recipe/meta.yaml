{% set version = "4.0.0" %}

package:
  name: triqs_dft_tools
  version: {{ version }}

source:
  url: https://github.com/TRIQS/dft_tools/releases/download/{{ version }}/dft_tools-{{ version }}.tar.gz
  sha256: 377c5f076f30fcfbbfab5f216c1b12d7fe63bb665cb02977b5237d0480162be5

build:
  number: 0
  skip: true  # [win or py<30]
  # Boost is header-only here; libboost-devel provides BoostConfig.cmake for
  # find_package(Boost) under CMP0167, but its compiled-lib run_export is not needed.
  ignore_run_exports:
    - libboost

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - cmake
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - {{ mpi }}                              # [mpi == 'openmpi' and build_platform != target_platform]
  host:
    - triqs {{ '.'.join(version.split('.')[:2]) }}
    - triqs_dftkit {{ '.'.join(version.split('.')[:2]) }}
    - libboost-devel
    - {{ mpi }}
    - libblas
    - liblapack
    - numpy
    - python
  run:
    - {{ pin_compatible("triqs", max_pin="x.x") }}
    - {{ pin_compatible("triqs_dftkit", max_pin="x.x") }}
    - {{ mpi }}
    - libblas
    - liblapack
    - python

test:
  commands:
    - export OMPI_MCA_btl=self,tcp
    - export OMPI_MCA_plm=isolated
    - export OMPI_MCA_rmaps_base_oversubscribe=yes
    - export OMPI_MCA_btl_vader_single_copy_mechanism=none
    - export mpiexec="mpiexec --allow-run-as-root"
    - python -c "import triqs_dft_tools"

about:
  home: https://triqs.github.io/dft_tools
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: Toolbox for ab initio calculations of correlated materials

extra:
  recipe-maintainers:
    - wentzell
    - pgunn
    - thoemi09
